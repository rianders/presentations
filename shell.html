<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <style>
        #root { min-height: 100vh; }
        #loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
        }
        #loading.hidden { display: none; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-600 mx-auto mb-4"></div>
            <p class="text-gray-600">Loading presentation...</p>
        </div>
    </div>
    <div id="root"></div>
    
    <script>
        // Get JSX file from query param: shell.html?p=20251216/camden-faculty-senate-20251216
        const params = new URLSearchParams(window.location.search);
        const presentation = params.get('p');
        
        if (presentation) {
            // Fetch the JSX file
            fetch(presentation + '.jsx')
                .then(response => {
                    if (!response.ok) throw new Error('Presentation not found');
                    return response.text();
                })
                .then(jsxCode => {
                    // A deck opts into a shared theme with "// @theme name" in its first
                    // five lines; themes/name/theme.jsx then loads first. Decks without
                    // the line load exactly as before.
                    const head = jsxCode.split('\n').slice(0, 5).join('\n');
                    const m = head.match(/^\s*\/\/\s*@theme\s+([a-z0-9-]+)\s*$/im);
                    if (!m) return [null, jsxCode];
                    return fetch('themes/' + m[1] + '/theme.jsx').then(r => {
                        if (!r.ok) throw new Error('Theme not found: ' + m[1]);
                        return r.text();
                    }).then(themeCode => [themeCode, jsxCode]);
                })
                .then(([themeCode, jsxCode]) => {
                    // Transform JSX to plain JS using Babel directly
                    const compile = (code) => Babel.transform(code, {
                        presets: [['react', { runtime: 'classic' }]],
                        sourceType: 'script'
                    }).code;
                    const compiled = [themeCode, jsxCode].filter(Boolean).map(compile);

                    // Hide loading indicator
                    document.getElementById('loading').classList.add('hidden');

                    // Inject each as a plain script tag, theme first. Classic scripts
                    // share one global scope, so the deck sees the theme's components.
                    for (const code of compiled) {
                        const script = document.createElement('script');
                        script.textContent = code;
                        document.body.appendChild(script);
                    }
                })
                .catch(error => {
                    document.getElementById('loading').innerHTML = `
                        <div class="text-center">
                            <p class="text-red-600 text-xl mb-2">⚠️ Error</p>
                            <p class="text-gray-600">${error.message}</p>
                            <a href="index.html" class="text-blue-600 underline mt-4 block">← Back to presentations</a>
                        </div>
                    `;
                });
        } else {
            document.getElementById('loading').innerHTML = `
                <div class="text-center">
                    <p class="text-gray-600 mb-4">No presentation specified</p>
                    <a href="index.html" class="text-blue-600 underline">← Back to presentations</a>
                </div>
            `;
        }
    </script>
</body>
</html>
